{% extends 'App/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Novo Estoque{% endblock %}

{% block conteudo %}
<div class="container mt-4">
    <div class="row">
        <!-- Sidebar/Menu Lateral -->
        <div class="col-md-3">
            <h2 style="letter-spacing:2px; font-weight: 400; font-size:2rem;">ESTOQUES:</h2>
            <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action">Estoques Cadastrados</a>
                <a href="#" class="list-group-item list-group-item-action active" style="background:#181818; border-color:#181818; color:white;">Adicionar Novo Estoque</a>
            </div>
        </div>
        <!-- Conteúdo -->
        <div class="col-md-9">
            <h3 class="mb-4" style="letter-spacing:1.5px; font-weight:300;">ADICIONAR NOVO ESTOQUE</h3>
            <form method="post" style="max-width: 600px;">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-dark" style="width:140px; margin-top:10px;">Salvar</button>
            </form>
            <a href="{% url 'selecionar_estoque' %}" class="btn btn-secondary mt-3" style="width:140px;">Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
